name: Deploy do site (produção)

# Sempre que houver push na branch main, o site é buildado e publicado no Firebase Hosting.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do site
        # Usa o Vite direto (o `npm run build` roda também o tsc, que hoje
        # falha por um teste pré-existente não relacionado ao app).
        run: npx vite build
        env:
          # Configuração PÚBLICA do Firebase (cliente web) — já fica embutida no
          # bundle do site, não é segredo. A segurança vem das regras do Firestore/RTDB.
          VITE_FIREBASE_API_KEY: AIzaSyDfKxRssbU-DjnDhf884tSQ0pdpSraRMD0
          VITE_FIREBASE_AUTH_DOMAIN: codifyx7.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: codifyx7
          VITE_FIREBASE_STORAGE_BUCKET: codifyx7.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "526189058276"
          VITE_FIREBASE_APP_ID: "1:526189058276:web:aa5f81497d48c2e37bf4f1"
          VITE_FIREBASE_DATABASE_URL: https://codifyx7-default-rtdb.firebaseio.com
          VITE_FIREBASE_MEASUREMENT_ID: G-BTFPE0J8CM

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODIFYX7 }}
          projectId: codifyx7
          channelId: live # publica direto em produção
